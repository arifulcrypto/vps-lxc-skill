name: Host OS

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu-minimal:24.04", "ubuntu:22.04", "images:debian/12", "images:debian/13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: canonical/setup-lxd@e38f436c468900dfe2b6ca98fb8eb352bbbb917a  # alpha upstream: keep pinned
        with:
          channel: 5.21/stable
      - name: Real host install, deploy and reboot
        run: sudo env "PATH=$PATH:/snap/bin" bash tests/e2e/host_os.sh "${{ matrix.image }}"
