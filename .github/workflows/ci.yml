name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check scripts tests
      - name: Skill entry points resolve
        run: test -f SKILL.md && test -f .agents/skills/vps-lxc-creator/SKILL.md
      - run: pytest -v

  lxd:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {channel: "4.0/stable", os: ubuntu-22.04}
          - {channel: "5.21/stable", os: ubuntu-24.04}
          - {channel: "latest/stable", os: ubuntu-24.04}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: canonical/setup-lxd@e38f436c468900dfe2b6ca98fb8eb352bbbb917a  # alpha upstream: keep pinned
        with:
          channel: ${{ matrix.channel }}
      - name: Real LXD smoke test
        run: sudo bash tests/e2e/lxd_smoke.sh "$RUNNER_TEMP/lxc"
